name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
            web:
              - 'apps/web/**'

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Format check
        run: make format-check-api
      - name: Test (Testcontainers needs Docker, available by default on this runner)
        run: make api-test
      - name: Build
        run: make api-build

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - name: Format check
        run: make format-check-web
      - name: Lint and typecheck
        run: make web-test
      - name: Build
        run: make web-build

  # Playwright smoke test against the full stack (testing-strategy.md: e2e smoke on every PR).
  e2e:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Start database and API
        run: |
          docker compose -f infra/local/docker-compose.yml up -d --wait postgres
          ./apps/api/gradlew -p apps/api bootRun --args='--spring.profiles.active=local' > api.log 2>&1 &
          timeout 300 bash -c 'until curl -sf localhost:8080/actuator/health/readiness; do sleep 3; done'
      - name: E2E smoke
        env:
          CI: 'true'
        run: make e2e
      - name: Upload report and API log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            api.log

  ci:
    if: always()
    needs: [gitleaks, backend, web, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          for result in "${{ needs.gitleaks.result }}" "${{ needs.backend.result }}" "${{ needs.web.result }}" "${{ needs.e2e.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A required job did not succeed: $result"
              exit 1
            fi
          done
