# Contract-first API definition (ADR-0005, docs/architecture/api-conventions.md).
# Edit this file first, then the code. ContractTest fails if the running API differs.
openapi: 3.1.0
info:
  title: Curiouskids Club API
  version: 1.0.0
  description: Lending library API. Errors are RFC 9457 problem+json.
paths:
  /api/v1/auth/register:
    post:
      tags:
        - auth
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "202":
          description: Accepted; check your email
        "400":
          description: VALIDATION_FAILED with field errors
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/verify-email:
    post:
      tags:
        - auth
      operationId: verifyEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
        required: true
      responses:
        "204":
          description: Email verified
        "400":
          description: TOKEN_INVALID or VALIDATION_FAILED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/verify-email/resend:
    post:
      tags:
        - auth
      operationId: resendVerification
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
        required: true
      responses:
        "202":
          description: Accepted; check your email
        "400":
          description: VALIDATION_FAILED with field errors
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/ping:
    get:
      tags:
        - ping
      operationId: ping
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResponse"
components:
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - NOT_ACCEPTABLE
            - CONFLICT
            - UNSUPPORTED_MEDIA_TYPE
            - EMAIL_NOT_VERIFIED
            - SLOT_REQUIRED
            - SLOT_FULL
            - SLOT_NOT_BOOKABLE
            - LIMIT_REACHED
            - ALREADY_HOLDING_TITLE
            - COPY_NOT_AVAILABLE
            - RENEWAL_NOT_ALLOWED
            - TOKEN_INVALID
            - IDEMPOTENCY_KEY_REUSED
            - RATE_LIMITED
            - INTERNAL_ERROR
        detail:
          type: string
        traceId:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ProblemFieldError"
      required:
        - code
        - status
        - title
        - traceId
        - type
    ProblemFieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
      required:
        - field
        - message
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 1
        password:
          type: string
          maxLength: 128
          minLength: 12
        name:
          type: string
          maxLength: 100
          minLength: 1
        phone:
          type: string
          maxLength: 30
          minLength: 0
          pattern: "^[0-9+()\\- ]*$"
        confirmAdult:
          type: boolean
          description: The parent confirms they are 18 or older (BR-28)
        acceptTerms:
          type: boolean
          description: The parent accepts the terms and privacy notice (BR-28)
      required:
        - acceptTerms
        - confirmAdult
        - email
        - name
        - password
    VerifyEmailRequest:
      type: object
      properties:
        token:
          type: string
          maxLength: 100
          minLength: 1
      required:
        - token
    ResendVerificationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 1
      required:
        - email
    PingResponse:
      type: object
      properties:
        status:
          type: string
        time:
          type: string
          format: date-time
      required:
        - status
        - time
