# Contract-first API definition (ADR-0005, docs/architecture/api-conventions.md).
# Edit this file first, then the code. ContractTest fails if the running API differs.
openapi: 3.1.0
info:
  title: Curiouskids Club API
  version: 1.0.0
  description: Lending library API. Errors are RFC 9457 problem+json.
paths:
  /api/v1/auth/register:
    post:
      tags:
        - auth
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '202':
          description: Accepted; check your email
        '400':
          description: VALIDATION_FAILED with field errors
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 'RATE_LIMITED: too many requests; see Retry-After'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/verify-email:
    post:
      tags:
        - auth
      operationId: verifyEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
        required: true
      responses:
        "204":
          description: Email verified
        "400":
          description: TOKEN_INVALID or VALIDATION_FAILED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/verify-email/resend:
    post:
      tags:
        - auth
      operationId: resendVerification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
        required: true
      responses:
        '202':
          description: Accepted; check your email
        '400':
          description: VALIDATION_FAILED with field errors
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 'RATE_LIMITED: too many requests; see Retry-After'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/password-reset/request:
    post:
      tags:
        - auth
      operationId: requestPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      responses:
        '202':
          description: Accepted; check your email
        '400':
          description: VALIDATION_FAILED with field errors
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 'RATE_LIMITED: too many requests; see Retry-After'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/password-reset/confirm:
    post:
      tags:
        - auth
      operationId: confirmPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '204':
          description: Password changed; every session of the account has ended
        '400':
          description: TOKEN_INVALID, or VALIDATION_FAILED with field errors
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/email-change/confirm:
    post:
      tags:
        - auth
      operationId: confirmEmailChange
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeConfirmRequest'
        required: true
      responses:
        '204':
          description: The account now uses the new address; the previous address is told
        '400':
          description: TOKEN_INVALID (also when the address now has another account) or VALIDATION_FAILED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/login:
    post:
      tags:
        - auth
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Logged in; the session cookie is set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: 'UNAUTHENTICATED: email or password is incorrect'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 'RATE_LIMITED: too many failed attempts; see Retry-After'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/logout:
    post:
      tags:
        - auth
      operationId: logout
      responses:
        '204':
          description: Logged out; the session no longer works
  /api/v1/auth/me:
    get:
      tags:
        - auth
      operationId: me
      responses:
        '200':
          description: The logged-in account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: 'UNAUTHENTICATED: not logged in'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/csrf:
    get:
      tags:
        - auth
      operationId: csrf
      responses:
        '204':
          description: The XSRF-TOKEN cookie is set
  /api/v1/me/children:
    get:
      tags:
        - family
      operationId: list
      responses:
        '200':
          description: The family's children, oldest profile first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChildResponse'
    post:
      tags:
        - family
      operationId: add
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildRequest'
        required: true
      responses:
        '201':
          description: Child added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildResponse'
        '400':
          description: VALIDATION_FAILED with field errors, including any field other than these
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'LIMIT_REACHED: the family already has the most children allowed'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/me/children/{id}:
    delete:
      tags:
        - family
      operationId: delete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Child removed
        '404':
          description: 'NOT_FOUND: no such child in your family'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      tags:
        - family
      operationId: update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildUpdateRequest'
        required: true
      responses:
        '200':
          description: Child changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildResponse'
        '400':
          description: VALIDATION_FAILED with field errors, including any field other than these
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 'NOT_FOUND: no such child in your family'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/me/profile:
    get:
      tags:
        - account
      operationId: getProfile
      responses:
        '200':
          description: Your details and reminder preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
    patch:
      tags:
        - account
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
        required: true
      responses:
        '200':
          description: Profile changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          description: VALIDATION_FAILED with field errors, including any field other than these
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/me/password:
    post:
      tags:
        - account
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      responses:
        '204':
          description: Password changed; your other sessions have ended
        '400':
          description: 'VALIDATION_FAILED: current password wrong or new one too weak'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 'RATE_LIMITED: too many wrong passwords; see Retry-After'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/me/email:
    post:
      tags:
        - account
      operationId: requestEmailChange
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
        required: true
      responses:
        '202':
          description: Accepted; a confirmation link is on its way to the new address
        '400':
          description: 'VALIDATION_FAILED: current password wrong, or the address is not new'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 'RATE_LIMITED: too many wrong passwords or emailed links; see Retry-After'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/ping:
    get:
      tags:
        - ping
      operationId: ping
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResponse"
components:
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - NOT_ACCEPTABLE
            - CONFLICT
            - UNSUPPORTED_MEDIA_TYPE
            - EMAIL_NOT_VERIFIED
            - SLOT_REQUIRED
            - SLOT_FULL
            - SLOT_NOT_BOOKABLE
            - LIMIT_REACHED
            - ALREADY_HOLDING_TITLE
            - COPY_NOT_AVAILABLE
            - RENEWAL_NOT_ALLOWED
            - TOKEN_INVALID
            - IDEMPOTENCY_KEY_REUSED
            - RATE_LIMITED
            - INTERNAL_ERROR
        detail:
          type: string
        traceId:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ProblemFieldError"
      required:
        - code
        - status
        - title
        - traceId
        - type
    ProblemFieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
      required:
        - field
        - message
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 1
        password:
          type: string
          maxLength: 128
          minLength: 12
        name:
          type: string
          maxLength: 100
          minLength: 1
        phone:
          type: string
          maxLength: 30
          minLength: 0
          pattern: "^[0-9+()\\- ]*$"
        confirmAdult:
          type: boolean
          description: The parent confirms they are 18 or older (BR-28)
        acceptTerms:
          type: boolean
          description: The parent accepts the terms and privacy notice (BR-28)
      required:
        - acceptTerms
        - confirmAdult
        - email
        - name
        - password
    VerifyEmailRequest:
      type: object
      properties:
        token:
          type: string
          maxLength: 100
          minLength: 1
      required:
        - token
    ResendVerificationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 1
      required:
        - email
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 1
      required:
        - email
    PasswordResetConfirmRequest:
      type: object
      properties:
        token:
          type: string
          maxLength: 100
          minLength: 1
        password:
          type: string
          maxLength: 128
          minLength: 12
      required:
        - password
        - token
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          minLength: 1
        password:
          type: string
          maxLength: 128
          minLength: 1
      required:
        - email
        - password
    MeResponse:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - MEMBER
            - VOLUNTEER
            - ADMIN
        familyId:
          type: string
          format: uuid
          description: Absent for staff
        emailVerified:
          type: boolean
      required:
        - accountId
        - emailVerified
        - role
    ChildRequest:
      type: object
      additionalProperties: false
      properties:
        firstName:
          type: string
          maxLength: 40
          minLength: 1
        ageBand:
          type: string
          enum:
            - 0-2
            - 3-5
            - 6-8
            - 9-12
            - 13+
          pattern: 0-2|3-5|6-8|9-12|13\+
      required:
        - ageBand
        - firstName
    ChildUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        firstName:
          type: string
          maxLength: 40
          minLength: 1
          pattern: .*\S.*
        ageBand:
          type: string
          enum:
            - 0-2
            - 3-5
            - 6-8
            - 9-12
            - 13+
          pattern: 0-2|3-5|6-8|9-12|13\+
    ChildResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        ageBand:
          type: string
          enum:
            - 0-2
            - 3-5
            - 6-8
            - 9-12
            - 13+
      required:
        - ageBand
        - firstName
        - id
    ProfileResponse:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
          description: Absent if none was given
        email:
          type: string
        pendingEmail:
          type: string
          description: A new address waiting for its confirmation link to be used
        remindPickup:
          type: boolean
          description: Pickup reminders (BR-32) are sent
        remindDueSoon:
          type: boolean
          description: Due-soon and due-today reminders (BR-33) are sent
      required:
        - email
        - name
        - remindDueSoon
        - remindPickup
    ProfileUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          pattern: .*\S.*
        phone:
          type: string
          maxLength: 30
          minLength: 0
          pattern: ^[0-9+()\- ]*$
        remindPickup:
          type: boolean
        remindDueSoon:
          type: boolean
    PasswordChangeRequest:
      type: object
      properties:
        currentPassword:
          type: string
          maxLength: 128
          minLength: 1
        newPassword:
          type: string
          maxLength: 128
          minLength: 12
      required:
        - currentPassword
        - newPassword
    EmailChangeRequest:
      type: object
      properties:
        newEmail:
          type: string
          format: email
          maxLength: 254
          minLength: 1
        currentPassword:
          type: string
          maxLength: 128
          minLength: 1
      required:
        - currentPassword
        - newEmail
    EmailChangeConfirmRequest:
      type: object
      properties:
        token:
          type: string
          maxLength: 100
          minLength: 1
      required:
        - token
    PingResponse:
      type: object
      properties:
        status:
          type: string
        time:
          type: string
          format: date-time
      required:
        - status
        - time
