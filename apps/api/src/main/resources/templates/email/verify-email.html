<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/layout :: layout(~{::#heading}, ~{::#content})}">
<body>
<h1 id="heading" style="margin:0 0 16px;font-size:22px;">Please confirm your email</h1>
<div id="content">
  <p style="margin:0 0 16px;">Thanks for joining Curiouskids Club! Press the button to confirm your email address, and then you can start borrowing books.</p>
  <p style="margin:0 0 24px;"><a th:href="${link}" style="display:inline-block;padding:12px 24px;background:#6d28d9;color:#ffffff;text-decoration:none;border-radius:8px;font-weight:bold;">Confirm my email</a></p>
  <p style="margin:0 0 16px;">The link works for 24 hours.</p>
  <p style="margin:0;font-size:14px;color:#4b5563;">If the button does not work, copy this link into your browser:<br>
    <span th:text="${link}" style="word-break:break-all;">link</span></p>
</div>
</body>
</html>
