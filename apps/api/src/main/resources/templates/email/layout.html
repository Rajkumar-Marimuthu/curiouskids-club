<!DOCTYPE html>
<html lang="en-GB" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(heading, content)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${subject}">Curiouskids Club</title>
</head>
<body style="margin:0;padding:0;background:#fdf8ef;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fdf8ef;">
    <tr>
      <td align="center" style="padding:24px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
               style="max-width:560px;background:#ffffff;border-radius:12px;">
          <tr>
            <td style="padding:24px;font-size:16px;line-height:1.5;">
              <p style="margin:0 0 16px;font-size:20px;font-weight:bold;color:#6d28d9;">Curiouskids Club</p>
              <h1 th:replace="${heading}">Heading</h1>
              <div th:replace="${content}">Content</div>
            </td>
          </tr>
        </table>
        <p style="margin:16px 0 0;font-size:13px;color:#4b5563;">
          This email is from Curiouskids Club, our neighbourhood lending library.
          If you were not expecting it, you can ignore it.
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
