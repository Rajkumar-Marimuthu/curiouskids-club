spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:club}
    username: ${POSTGRES_USER:club}
    password: ${POSTGRES_PASSWORD:club}
  mail:
    host: localhost
    port: ${MAILPIT_SMTP_PORT:1025}

springdoc:
  api-docs:
    enabled: true

club:
  identity:
    request-limits: # every local request (and make e2e) comes from one address
      register-per-address: 1000
      email-links-per-address: 1000
  notification:
    poll-interval: PT5S # send queued emails to Mailpit quickly while developing
