spring:
  application:
    name: club-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: false # GlobalExceptionHandler renders problem+json itself
  session:
    jdbc:
      initialize-schema: never # tables come from Flyway (V4)
  mail: # SMTP transport; local and test use Mailpit, AWS uses SES (club.notification.transport)
    host: localhost
    port: 1025

server:
  servlet:
    session:
      timeout: 30m # default; login sets 14 days for members, 30 minutes for staff. Cookie: SessionCookieConfig

club:
  timezone: Europe/London
  jobs:
    enabled: true # scheduled jobs; tests turn them off and run jobs directly
  notification:
    from: ${MAIL_FROM:Curiouskids Club <noreply@curiouskids.example>}
    app-base-url: ${APP_BASE_URL:http://localhost:5173}
    transport: smtp

logging:
  structured:
    format:
      console: ecs

springdoc:
  api-docs:
    enabled: false # exported only locally and in tests (contract check)
    version: openapi_3_1
  override-with-generic-response: false

management:
  endpoint:
    health:
      probes:
        enabled: true
