plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.10.3'
	id 'jacoco'
}

group = 'com.curiouskids'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom 'org.springframework.modulith:spring-modulith-bom:2.1.1'
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.modulith:spring-modulith-starter-core'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.1.1'
	runtimeOnly 'org.postgresql:postgresql'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'com.tngtech.archunit:archunit:1.5.1'
	testImplementation 'org.yaml:snakeyaml'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy 'jacocoTestReport'
}

// NFR-11: 80% line coverage overall, 90% branch coverage in circulation and scheduling domain code.
def coverageExcludes = ['com/curiouskids/club/ClubApplication*']

tasks.named('jacocoTestReport') {
	dependsOn 'test'
	classDirectories.setFrom(files(classDirectories.files.collect { fileTree(it) { exclude coverageExcludes } }))
}

tasks.named('jacocoTestCoverageVerification') {
	dependsOn 'test'
	classDirectories.setFrom(files(classDirectories.files.collect { fileTree(it) { exclude coverageExcludes } }))
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				minimum = 0.80
			}
		}
		rule {
			element = 'PACKAGE'
			includes = [
				'com.curiouskids.club.circulation.internal.domain*',
				'com.curiouskids.club.scheduling.internal.domain*',
			]
			limit {
				counter = 'BRANCH'
				minimum = 0.90
			}
		}
	}
}

spotless {
	java {
		googleJavaFormat()
		target 'src/**/*.java'
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

tasks.named('check') {
	dependsOn 'spotlessCheck'
}
